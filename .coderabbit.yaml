# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en"
early_access: false
tone_instructions: "Be concise and actionable. Prioritize security, correctness, and maintainability."
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  path_filters:
    - "!**/.github/workflows/**"
  path_instructions:
    - path: "src/**"
      instructions: "Review for type safety, error handling, and test coverage."
    - path: "tests/**"
      instructions: "Check that tests are independent and assert meaningful behavior."
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
chat:
  auto_reply: true
