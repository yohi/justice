name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@v2
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: bun install --frozen-lockfile
      - name: Build native review artifact provider
        run: bun run build:native:review-artifact
      - name: Verify native review artifact provider
        run: test -f dist/native/index.linux-x64-gnu.node
      - name: Test native review artifact provider
        run: cargo test --manifest-path native/review-artifact-linux/Cargo.toml --features test
      - name: Lint native review artifact provider
        run: |
          cargo fmt --manifest-path native/review-artifact-linux/Cargo.toml -- --check
          cargo clippy --manifest-path native/review-artifact-linux/Cargo.toml --all-targets --features test -- -D warnings
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run vitest run --config vitest.dist.config.ts
      - run: bun run vitest run --config vitest.integration.config.ts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: justice-dist
          path: dist/
