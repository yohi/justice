name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      - run: bun run typecheck

  native-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: bun install --frozen-lockfile
      - name: Build native review artifact provider
        run: bun run build:native:review-artifact
      - name: Verify native review artifact provider
        run: test -f dist/native/index.linux-x64-gnu.node
      - name: Upload native review artifact provider
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-review-artifact
          path: dist/native/index.linux-x64-gnu.node
          if-no-files-found: error

  test:
    needs: native-build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install supported OpenCode CLI
        run: bun install --global opencode-ai@1.18.29
      - run: bun install --frozen-lockfile
      - name: Download native review artifact provider
        uses: actions/download-artifact@v4
        with:
          name: linux-review-artifact
          path: dist/native
      - run: bun run build
      - run: bun run test
      - run: bun run vitest run --config vitest.dist.config.ts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: justice-dist
          path: dist/

  native:
    needs: native-build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: bun install --frozen-lockfile
      - name: Download native review artifact provider
        uses: actions/download-artifact@v4
        with:
          name: linux-review-artifact
          path: dist/native
      - name: Test native review artifact provider
        run: cargo test --manifest-path native/review-artifact-linux/Cargo.toml --features test
      - name: Lint native review artifact provider
        run: |
          cargo fmt --manifest-path native/review-artifact-linux/Cargo.toml -- --check
          cargo clippy --manifest-path native/review-artifact-linux/Cargo.toml --all-targets --features test -- -D warnings
      - run: bun run build
      - run: bun run vitest run --config vitest.integration.config.ts
