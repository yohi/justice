name: release-version-guard

on:
  pull_request:
    branches:
      - master
    paths:
      - package.json
      - .release-please-manifest.json

permissions:
  contents: read

jobs:
  guard:
    if: ${{ startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Validate release candidate version
        shell: bash
        run: |
          git tag --list 'v[0-9]*' > "$RUNNER_TEMP/release-tags.txt"
          node scripts/release-version-guard.mjs check \
            --package package.json \
            --manifest .release-please-manifest.json \
            --tags-file "$RUNNER_TEMP/release-tags.txt"
