name: release-please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-slim
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          target-branch: master
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        if: ${{ steps.release.outputs.release_created }}
        with:
          ref: ${{ steps.release.outputs.tag_name }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@yohi'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: ${{ steps.release.outputs.release_created }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}
      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        if: ${{ steps.release.outputs.release_created }}
      - name: Build native review artifact provider
        run: bun run build:native:review-artifact
        if: ${{ steps.release.outputs.release_created }}
      - name: Verify native review artifact provider
        run: test -f dist/native/index.linux-x64-gnu.node
        if: ${{ steps.release.outputs.release_created }}
      - name: Build
        run: bun run build
        if: ${{ steps.release.outputs.release_created }}
      - name: Upload Build Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: justice-dist
          path: dist/
        if: ${{ steps.release.outputs.release_created }}
      - name: Resolve release channel
        id: channel
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          # Fails closed on tag/package.json/manifest mismatch or invalid version (no publish).
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          manifest_version="$(node -p 'JSON.parse(require("node:fs").readFileSync(".release-please-manifest.json", "utf8"))["."]')"
          if [[ "$version" != "$manifest_version" ]]; then
            echo "package.json ($version) and manifest ($manifest_version) differ" >&2
            exit 1
          fi
          node scripts/release-version-guard.mjs channel --version "$version" --tag "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
        if: ${{ steps.release.outputs.release_created }}
      - name: Pack release tarball
        id: pack
        shell: bash
        run: |
          npm pack --json --ignore-scripts > "$RUNNER_TEMP/pack.json"
          node -p 'JSON.parse(require("node:fs").readFileSync(process.env.RUNNER_TEMP + "/pack.json", "utf8"))[0].filename' > "$RUNNER_TEMP/tarball-name.txt"
          printf 'file=%s\n' "$(cat "$RUNNER_TEMP/tarball-name.txt")" >> "$GITHUB_OUTPUT"
        if: ${{ steps.release.outputs.release_created }}
      - name: Verify package includes native addon, V1/V2 artifacts and export targets
        run: node scripts/verify-package-contents.mjs "$RUNNER_TEMP/pack.json" package.json
        if: ${{ steps.release.outputs.release_created }}
      - name: Publish to GitHub Packages
        run: npm publish "./${TARBALL}" --tag "${DIST_TAG}" --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.file }}
          DIST_TAG: ${{ steps.channel.outputs.dist_tag }}
        if: ${{ steps.release.outputs.release_created }}
      - name: Upload Release Asset
        run: gh release upload "${RELEASE_TAG}" "./${TARBALL}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          TARBALL: ${{ steps.pack.outputs.file }}
        if: ${{ steps.release.outputs.release_created }}
